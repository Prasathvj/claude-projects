<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>* { margin:0; padding:0; box-sizing:border-box; } html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#F4EDE3; }
    #root { position:relative; width:100%; height:100%; --bg:#F4EDE3; --surface:#FFFAF7; --fg:#2A2018; --border:#EADCCD; --muted:#E6D8C8; --accent:#F87736; --brand:#F87736; --accent-2:#E98F5E; --font-body:'SD Text'; }</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="m1" data-composition-id="robot-map" data-composition-src="compositions/robot-map.html" data-start="0" data-duration="7" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="m2" data-composition-id="c1" data-composition-src="compositions/c1.html" data-start="7" data-duration="4.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="m3" data-composition-id="comparison-split" data-composition-src="compositions/components/comparison-split.html" data-variable-values='{"labelA":"Easy for humans","labelB":"Hard for humans"}' data-start="11.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>window.__timelines = window.__timelines || {}; window.__timelines["main"] = gsap.timeline({ paused: true });</script>
  </body>
</html>
