<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'SD Display';src:url('/ep01-test/assets/fonts/InterDisplay-Black.otf');font-weight:900}
@font-face{font-family:'SD Mono';src:url('/ep08-long/assets/fonts/JetBrainsMono-Bold.ttf');font-weight:700}
*{margin:0;box-sizing:border-box} body{width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#121826 0%,#07090E 60%,#030405 100%);position:relative}
.p{position:absolute;top:0;width:640px;height:1080px;overflow:hidden}
.m{position:absolute;left:60px;top:170px}
.beam{position:absolute;left:600px;top:350px;width:420px;height:300px;background:linear-gradient(90deg,rgba(255,236,180,.55),rgba(255,236,180,0));clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);filter:blur(6px)}
.torch{position:absolute;left:560px;top:488px;width:64px;height:24px;transform:rotate(-12deg);border-radius:6px;background:#2A2A2A;box-shadow:inset -10px 0 0 #FFE9A8}
.lbl{position:absolute;left:0;right:0;top:40px;text-align:center;font:900 54px 'SD Display';color:#E8EDF5}
.sub{position:absolute;left:0;right:0;top:110px;text-align:center;font:700 24px 'SD Mono';color:#FF3B30;letter-spacing:3px}
.dim{filter:brightness(.78) drop-shadow(-14px 0 18px rgba(248,119,54,.45))}
#grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:screen}
.sep{position:absolute;top:80px;bottom:80px;width:2px;background:rgba(255,255,255,.08)}
</style><script src="/host/host.js"></script></head><body>
<div class="p" style="left:0"><div class="lbl">B1 · NO GLOW</div><div class="sub">NO RIM LIGHT</div><div class="beam"></div><div class="m" id="a" style="filter:brightness(.8)"></div><div class="torch"></div></div>
<div class="sep" style="left:640px"></div>
<div class="p" style="left:640px"><div class="lbl">B2 · MOONLIGHT</div><div class="sub">SOFT BLUE-WHITE RIM</div><div class="beam"></div><div class="m" id="b" style="filter:brightness(.85) drop-shadow(-10px -4px 14px rgba(170,200,255,.45))"></div><div class="torch"></div></div>
<div class="sep" style="left:1280px"></div>
<div class="p" style="left:1280px"><div class="lbl">B3 · RED ALERT</div><div class="sub">FAINT RED RIM</div><div class="beam"></div><div class="m" id="c" style="filter:brightness(.82) drop-shadow(-10px 0 16px rgba(255,59,48,.35))"></div><div class="torch"></div></div>
<svg id="grain" width="1920" height="1080"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" filter="url(#g)"/></svg>
<script>
const base={skin:'#F0C4A0',hair:'messy',hairCol:'#5A3A26',glasses:'round',hood:'down',top:'#F87736',topS:'#D85E25',phones:'none',beard:'stubble'};
const pose={brows:'focused',eyes:'squint',mouth:'smirk',arms:'point',look:[1,0],w:520,h:676};
document.getElementById('a').innerHTML=HOST.render({char:{...base,hood:'up',top:'#2B2F38',topS:'#1C1F26',inner:'#0D0F13',strings:'#F87736'},...pose});
document.getElementById('b').innerHTML=HOST.render({char:{...base,hood:'up',top:'#2B2F38',topS:'#1C1F26',inner:'#0D0F13',strings:'#F87736'},...pose});
document.getElementById('c').innerHTML=HOST.render({char:{...base,hood:'up',top:'#2B2F38',topS:'#1C1F26',inner:'#0D0F13',strings:'#F87736'},...pose});
</script></body></html>
