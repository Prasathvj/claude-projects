<!-- hyperframes-registry-item: world-map -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>World Map</title>
    
    
    
    <script src="assets/gsap.min.js"></script>
    <script
      src="assets/d3.min.js"
    ></script>
    <script src="assets/topojson-client.min.js"></script>
    <style>
@font-face { font-family: 'SD Display'; src: url('assets/fonts/InterDisplay-Black.otf'); font-weight: 900; }
@font-face { font-family: 'SD Display'; src: url('assets/fonts/InterDisplay-Bold.otf'); font-weight: 700; }
@font-face { font-family: 'SD Text'; src: url('assets/fonts/Inter-SemiBold.otf'); font-weight: 600; }
@font-face { font-family: 'SD Mono'; src: url('assets/fonts/JetBrainsMono-Bold.ttf'); font-weight: 700; }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F4EDE3;
      }

      #robot-map {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 70% 40%, #FBE3D2 0%, #F4EDE3 60%);
        font-family: 'SD Text', sans-serif;
        color: #2A2018;
        overflow: hidden;
      }

      #robot-map .headline { font-family:'SD Display'; font-weight:900 !important;
        position: absolute;
        top: 120px;
        left: 80px;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #2A2018;
        clip-path: inset(0 100% 0 0);
      }

      #robot-map .subtitle {
        position: absolute;
        top: 214px;
        left: 80px;
        font-size: 30px;
        font-weight: 300;
        color: #8C6B5A;
        opacity: 0;
      }

      #robot-map .map-container {
        position: absolute;
        top: 250px;
        left: 270px;
        width: 1380px;
        height: 700px;
      }

      #robot-map .map-container svg {
        width: 1380px;
        height: 700px;
      }

      #robot-map .country-path {
        stroke: #E6D8C8;
        stroke-width: 0.6;
        opacity: 0;
        cursor: default;
      }

      #robot-map .ocean {
        fill: none;
      }

      #robot-map .graticule {
        fill: none;
        stroke: #E6D8C8;
        stroke-width: 0.3;
        stroke-opacity: 0.4;
      }

      #robot-map .legend-group { display:none !important;
        position: absolute;
        bottom: 80px;
        right: 80px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        opacity: 0;
      }

      #robot-map .legend-bar {
        width: 280px;
        height: 14px;
        border-radius: 7px;
      }

      #robot-map .legend-labels {
        display: flex;
        justify-content: space-between;
        width: 280px;
        font-size: 13px;
        font-weight: 500;
        color: #8C6B5A;
      }

      #robot-map .source {
        position: absolute;
        bottom: 36px;
        left: 80px;
        font-size: 13px;
        font-weight: 400;
        color: #8C6B5A;
        opacity: 0;
      }

      #robot-map .tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid #EADCCD;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        color: #2A2018;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(4px);
        backdrop-filter: blur(8px);
        z-index: 10;
      }

      #robot-map .tooltip .tt-value {
        color: #F87736;
        font-weight: 600;
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <div
      id="robot-map"
      data-composition-id="robot-map"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="14"
    >
      <h1 class="headline">Where the new robots went</h1>
      <p class="subtitle">Industrial robot installations, 2025 · China installed 59%</p>

      <div class="map-container">
        <svg id="robot-map-svg"></svg>
      </div>

      <div class="legend-group">
        <div
          class="legend-bar"
          style="
            background: linear-gradient(90deg, #F6D6BE 0%, #F8A06E 40%, #F87736 70%, #C85019 100%);
          "
        ></div>
        <div class="legend-labels">
          <span>Fewer</span>
          <span>More</span>
        </div>
      </div>

      <p class="source">Source: IFR World Robotics 2026 · shading shows the largest markets</p>

      <div class="tooltip"></div>
    </div>

    <script>
      (function () {
        /* ── GDP per capita data (2024 IMF estimates, USD) ── */
        /* Keys are ISO 3166-1 numeric codes as strings (3-digit, zero-padded) */
        var gdpData = {
          156: { name: "China", gdp: 100 },
          840: { name: "United States", gdp: 55 },
          392: { name: "Japan", gdp: 45 },
          410: { name: "South Korea", gdp: 40 },
          276: { name: "Germany", gdp: 35 },
          356: { name: "India", gdp: 30 },
        };

        /* Top 5 GDP countries for highlight pulse */
        var top5Codes = ["156", "840", "356"];

        /* GDP range for color scale */
        var gdpValues = [];
        var codes = Object.keys(gdpData);
        for (var i = 0; i < codes.length; i++) {
          gdpValues.push(gdpData[codes[i]].gdp);
        }
        var minGdp = Math.min.apply(null, gdpValues);
        var maxGdp = Math.max.apply(null, gdpValues);

        /* Color interpolation: green → teal → cyan → white */
        var colorStops = [
          { r: 246, g: 214, b: 190 },
          { r: 248, g: 160, b: 110 },
          { r: 248, g: 119, b: 54 },
          { r: 200, g: 80, b: 25 },
        ];

        function gdpToColor(value) {
          var fixed={100:"#F87736",55:"#F8A06E",45:"#F9B58C",40:"#F9B58C",35:"#F9B58C",30:"#C85019"}; if(fixed[value]) return fixed[value];
          var t = (value - minGdp) / (maxGdp - minGdp);
          t = Math.max(0, Math.min(1, t));
          var scaledT = t * (colorStops.length - 1);
          var idx = Math.floor(scaledT);
          if (idx >= colorStops.length - 1) idx = colorStops.length - 2;
          var localT = scaledT - idx;
          var c0 = colorStops[idx];
          var c1 = colorStops[idx + 1];
          var r = Math.round(c0.r + (c1.r - c0.r) * localT);
          var g = Math.round(c0.g + (c1.g - c0.g) * localT);
          var b = Math.round(c0.b + (c1.b - c0.b) * localT);
          return "rgb(" + r + "," + g + "," + b + ")";
        }

        /* Default fill for countries without data */
        var defaultFill = "#E6D8C8";

        /* ── Build the map ── */
        var svg = d3
          .select("#robot-map-svg")
          .attr("viewBox", "0 0 1380 700")
          .attr("preserveAspectRatio", "xMidYMid meet");

        var projection = d3.geoNaturalEarth1().fitSize([1380, 700], { type: "Sphere" });

        var pathGenerator = d3.geoPath().projection(projection);

        /* Graticule */
        var graticule = d3.geoGraticule10();
        svg.append("path").datum(graticule).attr("class", "graticule").attr("d", pathGenerator);

        /* Tooltip element */
        var tooltipEl = document.querySelector("#robot-map .tooltip");

        /* Fetch topology and render countries */
        d3.json("assets/countries-110m.json").then(
          function (world) {
            var countries = topojson.feature(world, world.objects.countries).features;

            svg
              .selectAll(".country-path")
              .data(countries)
              .enter()
              .append("path")
              .attr("class", "country-path")
              .attr("d", pathGenerator)
              .attr("data-country", function (d) {
                return String(d.id).padStart(3, "0");
              })
              .attr("fill", function (d) {
                var code = String(d.id).padStart(3, "0");
                if (gdpData[code]) {
                  return gdpToColor(gdpData[code].gdp);
                }
                return defaultFill;
              })
              .on("mouseenter", function (event, d) {
                var code = String(d.id).padStart(3, "0");
                if (gdpData[code]) {
                  var entry = gdpData[code];
                  tooltipEl.innerHTML =
                    entry.name +
                    '<span class="tt-value">$' +
                    entry.gdp.toLocaleString() +
                    "</span>";
                  tooltipEl.style.opacity = "1";
                  tooltipEl.style.transform = "translateY(0)";
                }
              })
              .on("mousemove", function (event) {
                var container = document.querySelector("#robot-map");
                var rect = container.getBoundingClientRect();
                var x = event.clientX - rect.left + 16;
                var y = event.clientY - rect.top - 40;
                tooltipEl.style.left = x + "px";
                tooltipEl.style.top = y + "px";
              })
              .on("mouseleave", function () {
                tooltipEl.style.opacity = "0";
                tooltipEl.style.transform = "translateY(4px)";
              });

            /* ── GSAP Timeline ── */
            buildTimeline();
          },
        );

        function buildTimeline() {
          var tl = gsap.timeline({ paused: true });

          /* 0s: Headline clip-path wipe reveal (1s) */
          tl.to(
            "#robot-map .headline",
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1,
              ease: "power3.inOut",
            },
            0,
          );

          /* 0.4s: Subtitle fade in (0.6s) */
          tl.to(
            "#robot-map .subtitle",
            {
              opacity: 1,
              duration: 0.6,
              ease: "power2.out",
            },
            0.4,
          );

          /* 1.0s: Countries stagger reveal */
          tl.to(
            "#robot-map .country-path",
            {
              opacity: 1,
              duration: 0.3,
              stagger: {
                each: 0.02,
                from: "center",
              },
              ease: "power1.out",
            },
            1.0,
          );

          /* 4.0s: Legend fade in */
          tl.to(
            "#robot-map .legend-group",
            {
              opacity: 1,
              duration: 0.6,
              ease: "power2.out",
            },
            4.0,
          );

          /* 4.5s: Source fade in */
          tl.to(
            "#robot-map .source",
            {
              opacity: 1,
              duration: 0.5,
              ease: "power2.out",
            },
            4.5,
          );

          /* 5.0s: Highlight pulse on top 5 GDP countries */
          for (var i = 0; i < top5Codes.length; i++) {
            var selector = '#robot-map [data-country="' + top5Codes[i] + '"]';

            /* Pulse up: brightness + white stroke */
            tl.to(
              selector,
              {
                filter: "brightness(1.5)",
                stroke: "#2A2018",
                strokeWidth: 1.8,
                duration: 0.4,
                ease: "power2.out",
              },
              5.0 + i * 0.15,
            );

            /* Pulse back to normal */
            tl.to(
              selector,
              {
                filter: "brightness(1)",
                stroke: "#E6D8C8",
                strokeWidth: 0.6,
                duration: 0.6,
                ease: "power2.inOut",
              },
              5.0 + i * 0.15 + 0.4,
            );
          }

          /* Register timeline */
          if (!window.__timelines) {
            window.__timelines = {};
          }
          window.__timelines["robot-map"] = tl;
        }
      })();
    </script>
  </body>
</html>
