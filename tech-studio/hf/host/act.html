<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'SD Display';src:url('../ep01-test/assets/fonts/InterDisplay-Black.otf');font-weight:900}
@font-face{font-family:T;src:url('../ep01-test/assets/fonts/Inter-SemiBold.otf');font-weight:600}
body{margin:0;width:1080px;height:1080px;background:#0C0704;overflow:hidden;position:relative;font-family:T}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(248,119,54,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(248,119,54,.10) 2px,transparent 2px);background-size:108px 108px}
.glow{position:absolute;left:140px;top:120px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(248,119,54,.25),transparent 65%)}
#h{position:absolute;left:240px;top:150px}
#lab{position:absolute;left:0;right:0;top:56px;text-align:center;font:900 44px 'SD Display';color:#F87736;letter-spacing:2px}
#cap{position:absolute;left:0;right:0;bottom:60px;text-align:center;font:900 52px 'SD Display';color:#F6EEE8}
</style><script src="host.js"></script></head><body><div class="grid"></div><div class="glow"></div><div id="lab"></div><div id="h"></div><div id="cap"></div>
<script>
let LS=null;
async function init(){LS=await (await fetch('/host/lipsync.json')).json();}
const SEG=[ // [t0,t1,label,caption,expression]
 [0,1.5,'EXPLAINING','This recipe page…',{brows:'up',eyes:'open',arms:'point',look:[1,0]}],
 [1.5,2.4,'HAPPY','…looks harmless.',{brows:'up',eyes:'happy',mouth:'smile',tilt:-4}],
 [2.4,3.73,'SUSPICIOUS','But hit select all…',{brows:'skeptic',eyes:'squint',mouth:'smirk',look:[-1,0],tilt:-5}],
 [3.73,5.33,'THINKING','…a hidden message.',{brows:'skeptic',eyes:'open',arms:'chin',look:[1,-1],extra:['question']}],
 [5.33,6.87,'SHOCKED','Written for AI.',{brows:'high',eyes:'wide',mouth:'shock',arms:'hands-up',extra:['bang']}],
 [6.87,9.2,'WORRIED','Your AI agent is taking orders…',{brows:'worried',eyes:'worried',mouth:'wavy',extra:['sweat'],look:[-1,0]}],
 [9.2,11,'ANGRY','…from a stranger.',{brows:'angry',eyes:'angry',mouth:'frown',extra:['anger']}],
];
let prevV='rest',hold=0;
function frame(i){
 const t=i/LS.fps, e=LS.env[Math.min(i,LS.env.length-1)]||0, z=LS.zc[Math.min(i,LS.zc.length-1)]||0;
 const s=SEG.find(x=>t>=x[0]&&t<x[1])||SEG[SEG.length-1];
 const o={...s[4]};
 let v= e<0.07?null: e>0.55?'A': z>0.28?'E': e>0.3?'O':'M';
 if(v&&hold>0&&v!==prevV){v=prevV;hold--;} else if(v){if(v!==prevV)hold=1;prevV=v;}
 if(v) o.mouth = (o.mouth==='shock' && v!=='M') ? 'shock' : v;
 const bl=[1.2,4.6,8.3].some(b=>t>=b&&t<b+0.1)?0.9:0;
 o.blink=bl; o.tilt=(o.tilt||0)+Math.sin(t*2.1)*1.5+e*2.5;
 const k=Math.max(0,1-(t-s[0])/0.12); // pop on expression change
 document.getElementById('h').innerHTML=HOST.render({char:{skin:'#F0C4A0',hair:'messy',hairCol:'#5A3A26',glasses:'round',hood:'down',top:'#F87736',topS:'#D85E25',phones:'none',beard:'stubble'},...o,w:600,h:780});
 document.getElementById('h').style.transform=`translateY(${-e*6}px) scale(${1+0.04*k})`;
 document.getElementById('lab').textContent=s[2];
 document.getElementById('cap').textContent=s[3];
}
</script></body></html>
