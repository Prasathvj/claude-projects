<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'SD Display';src:url('/ep01-test/assets/fonts/InterDisplay-Black.otf');font-weight:900}
@font-face{font-family:T;src:url('/ep01-test/assets/fonts/Inter-SemiBold.otf');font-weight:600}
body{margin:0;width:1920px;height:900px;background:#0C0704;color:#F6EEE8;font-family:T;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(248,119,54,.09) 2px,transparent 2px),linear-gradient(90deg,rgba(248,119,54,.09) 2px,transparent 2px);background-size:96px 96px}
h1{position:relative;text-align:center;font:900 54px 'SD Display';margin:22px 0 10px}h1 span{color:#F87736}
.row{position:relative;display:flex;align-items:center;margin:0 30px 16px;background:linear-gradient(180deg,#2C1A13,#1F120C);border:2px solid #3E2217;border-radius:26px;padding:8px 10px}
.lab{width:250px;padding-left:16px}.lab b{font:900 46px 'SD Display';display:block}.lab b span{color:#F87736}.lab i{font:600 20px T;color:#9E745A;font-style:normal;line-height:1.3}
.cell{width:232px;text-align:center}.cell div{font:600 16px T;color:#F87736;letter-spacing:2px;margin-top:-4px}
</style><script src="/host/bit.js"></script></head><body><div class="grid"></div>
<h1>Meet <span>Bit</span> · choose a style</h1><div id="w"></div>
<script>
const STY=[['A','Classic','Rounded helmet, antenna, chest screen. Friendly and readable at Short size.','classic'],
['B','Orb','Floating ball with a hover ring. Cute, compact, fits beside Max.','orb'],
['C','Retro CRT','Little TV-monitor head with scanlines. Most "tech" personality.','crt']];
const ST=[['normal','down',[],'NORMAL'],['scan','down',['laser'],'SCANNING'],['hijack','down',['alert'],'HIJACKED'],['gasp','hug',['sweat'],'"I FELL FOR THAT?!"'],['happy','type',['done'],'TASK COMPLETE'],['worried','stop',[],'STOP SIGN'],['happy','wave',[],'WAVE']];
const w=document.getElementById('w');
for(const [n,name,desc,style] of STY){const r=document.createElement('div');r.className='row';
 r.innerHTML=`<div class="lab"><b><span>${n}</span> ${name}</b><i>${desc}</i></div>`+ST.map(([s,a,e,l])=>`<div class="cell">${BIT.render({style,state:s,arms:a,extra:e,w:228,h:206})}<div>${l}</div></div>`).join('');
 w.appendChild(r);}
</script></body></html>
