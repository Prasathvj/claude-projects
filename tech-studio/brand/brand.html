<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'SD Display';src:url('/ep01-test/assets/fonts/InterDisplay-Black.otf');font-weight:900}
@font-face{font-family:T;src:url('/ep01-test/assets/fonts/Inter-SemiBold.otf');font-weight:600}
@font-face{font-family:S;src:url('/ep01-test/assets/fonts/CormorantItalic-600.ttf');font-weight:600;font-style:italic}
body{margin:0;background:#0C0704;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(248,119,54,.10) 3px,transparent 3px),linear-gradient(90deg,rgba(248,119,54,.10) 3px,transparent 3px)}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(248,119,54,.30),rgba(248,119,54,.08) 40%,transparent 66%)}
.plus{position:absolute;color:#F87736;font:500 70px T;opacity:.8}
.name{font:900 150px 'SD Display';color:#F6EEE8;letter-spacing:-3px;line-height:.95}
.name em{font:600 italic 120px S;color:#F87736;letter-spacing:0}
.tag{font:600 46px T;color:#E9D7CB;margin-top:22px}
.pill{display:inline-flex;align-items:center;gap:14px;margin-top:26px;height:76px;padding:0 34px;border-radius:38px;border:3px solid #F87736;background:#1A0F0A;font:600 34px T;color:#F6EEE8}
.pill i{width:16px;height:16px;border-radius:8px;background:#F87736;box-shadow:0 0 16px #F87736}
</style><script src="/host/host.js"></script></head><body><div id="root"></div>
<script>
const MAX={skin:'#F0C4A0',hair:'messy',hairCol:'#5A3A26',glasses:'round',hood:'down',top:'#F87736',topS:'#D85E25',phones:'none',beard:'stubble'};
const q=new URLSearchParams(location.search), mode=q.get('m'), NAME=q.get('n')||'Decoded|with Max';
const [n1,n2]=NAME.split('|');
const head=(o,vb,w,h)=>HOST.render({char:MAX,...o,w,h}).replace('viewBox="0 0 400 520"',`viewBox="${vb}"`);
const r=document.getElementById('root');
if(mode==='avatar'){ // 800x800 profile picture (shown as a circle)
 document.body.style.cssText+='width:800px;height:800px';
 r.innerHTML=`<div class="grid" style="background-size:80px 80px"></div><div class="glow" style="left:-100px;top:-60px;width:1000px;height:1000px"></div>
 <div style="position:absolute;left:40px;top:40px;width:720px;height:720px;border-radius:50%;border:14px solid #F87736;box-sizing:border-box;box-shadow:0 0 60px rgba(248,119,54,.5), inset 0 0 50px rgba(248,119,54,.25)"></div>
 <div style="position:absolute;left:70px;top:90px;width:660px;height:660px;border-radius:50%;overflow:hidden"><div style="position:absolute;left:30px;top:10px">${head({brows:'up',eyes:'open',mouth:'smile',tilt:-4},'70 60 260 300',600,692)}</div></div>`;
} else if(mode==='watermark'){ // 150x150 video watermark
 document.body.style.cssText+='width:150px;height:150px;background:transparent';
 r.innerHTML=`<div style="position:absolute;left:5px;top:5px;width:140px;height:140px;border-radius:50%;background:#0C0704;border:7px solid #F87736;box-sizing:border-box;overflow:hidden">
  <div style="position:absolute;left:4px;top:8px">${head({brows:'up',mouth:'smile'},'100 70 200 230',118,136)}</div></div>`;
} else { // 2560x1440 banner; safe area 1546x423 centred (507..2053, 508..931)
 document.body.style.cssText+='width:2560px;height:1440px';
 r.innerHTML=`<div class="grid" style="background-size:120px 120px"></div>
 <div class="glow" style="left:300px;top:200px;width:1300px;height:1300px"></div><div class="glow" style="left:1500px;top:-300px;width:1200px;height:1200px"></div>
 <div class="plus" style="left:420px;top:380px">+</div><div class="plus" style="left:2120px;top:960px">+</div><div class="plus" style="left:1960px;top:420px;font-size:46px;opacity:.5">+</div>
 <div style="position:absolute;left:560px;top:478px;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%)">${head({brows:'up',eyes:'open',mouth:'A',arms:'point',look:[1,0]},'60 50 380 470',380,470)}</div>
 <div style="position:absolute;left:980px;top:540px;width:1100px">
  <div class="name">${n1}${n2?` <em>${n2}</em>`:''}</div>
  <div class="tag">Tech, explained. AI & tech news in plain English.</div>
  <div class="pill"><i></i>New Shorts daily · Deep dives weekly</div>
 </div>`;
}
</script></body></html>
